<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/re/yt-v3/manifest.json">
    <link rel="icon" href="/re/yt-v3/icon-192.png">
    <link rel="apple-touch-icon" href="/re/yt-v3/icon-192.png">
    <title>Ads Free YouTube Video Player</title>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%;
            height: 100%;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
        }

        /* ---------- Layout: player (+ search panel) above the bar ---------- */
        #main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Player area ---------- */
        .player-wrapper {
            position: relative;
            flex: 1;
            min-height: 0;
            background: #000;
        }

        .player-wrapper iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px;
            text-align: center;
            color: #999;
            font-size: clamp(14px, 3.5vw, 18px);
            cursor: pointer;
        }

        .placeholder svg {
            width: clamp(60px, 18vw, 110px);
            height: auto;
            opacity: 0.35;
        }

        .placeholder small { color: #666; font-size: 0.8em; }

        /* ---------- Paste bar ---------- */
        #bar {
            background: #141414;
            border-top: 1px solid #2a2a2a;
            padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
            padding-left: calc(10px + env(safe-area-inset-left, 0px));
            padding-right: calc(10px + env(safe-area-inset-right, 0px));
        }

        #bar .row {
            display: flex;
            gap: 8px;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        #bar.collapsed .row { display: none; }
        #bar.collapsed { padding-top: 2px; padding-bottom: calc(2px + env(safe-area-inset-bottom, 0px)); }

        #urlInput {
            flex: 1;
            min-width: 0;
            padding: 11px 14px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #0b0b0b;
            color: #fff;
            font-size: 16px; /* prevents zoom on mobile */
        }

        #urlInput:focus { outline: none; border-color: #ff3b3b; }
        #urlInput::placeholder { color: #666; }

        .btn {
            padding: 11px 16px;
            border: none;
            border-radius: 10px;
            background: #ff0000;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn.secondary { background: #2b2b2b; }
        .btn:active { transform: scale(0.96); }

        .toggle {
            display: block;
            margin: 0 auto;
            width: 48px;
            height: 18px;
            background: none;
            border: none;
            color: #777;
            font-size: 14px;
            line-height: 18px;
            cursor: pointer;
        }

        #bar.collapsed .toggle { transform: rotate(180deg); }

        @media (max-width: 480px) {
            #bar .row { flex-wrap: wrap; }
            #urlInput { flex: 1 1 100%; }
            .btn { flex: 1; padding-left: 8px; padding-right: 8px; }
        }

        @media (max-height: 420px) {
            #bar { padding-top: 4px; padding-bottom: 4px; }
            #urlInput, .btn { padding-top: 7px; padding-bottom: 7px; }
        }

        .btn.secondary.on { background: #3a3a3a; box-shadow: inset 0 0 0 2px #ff3b3b; }

        /* ---------- Search panel ---------- */
        #searchPanel {
            display: none;
            flex-direction: column;
            min-height: 0;
            min-width: 0;
            background: #101010;
            border-top: 1px solid #2a2a2a;
        }

        body.search-open #searchPanel { display: flex; flex: 1 1 0; }

        /* Portrait: video on top at 16:9, results fill the rest */
        body.search-open .player-wrapper {
            flex: 0 0 auto;
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 45%;
        }

        /* Landscape: video on the left, results on the right */
        @media (orientation: landscape) {
            body.search-open #main { flex-direction: row; }
            body.search-open .player-wrapper {
                flex: 1 1 0;
                width: auto;
                min-width: 0;
                aspect-ratio: auto;
                max-height: none;
            }
            body.search-open #searchPanel {
                flex: 0 0 min(420px, 45%);
                border-top: none;
                border-left: 1px solid #2a2a2a;
            }
        }

        .sp-wrap { position: relative; }
        .sp-head { display: flex; gap: 8px; padding: 8px 10px 4px; }

        /* ---------- Suggestions dropdown ---------- */
        #suggest {
            display: none;
            position: absolute;
            left: 10px;
            right: 10px;
            top: calc(100% - 2px);
            z-index: 20;
            max-height: 55vh;
            overflow-y: auto;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .6);
        }

        .sg {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 4px 0 12px;
            cursor: pointer;
            color: #eee;
            font-size: 15px;
        }

        .sg:active, .sg.sel { background: #2a2a2a; }
        .sg .ic { color: #777; flex: 0 0 auto; }
        .sg .tx { flex: 1; min-width: 0; padding: 11px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .sg .fill { flex: 0 0 auto; width: 40px; height: 40px; border: none; background: none; color: #888; font-size: 18px; cursor: pointer; }

        #searchInput {
            flex: 1;
            min-width: 0;
            padding: 10px 14px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #0b0b0b;
            color: #fff;
            font-size: 16px;
        }

        #searchInput:focus { outline: none; border-color: #ff3b3b; }
        #searchInput::placeholder { color: #666; }

        .sp-tools {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px 6px;
        }

        .sp-tools .grow { flex: 1; }

        #resultInfo {
            padding: 0 12px 4px;
            font-size: 12px;
            color: #777;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #resultInfo:empty { display: none; }

        .chip.on { background: #ff0000; border-color: #ff0000; color: #fff; }

        .chip {
            padding: 6px 12px;
            border: 1px solid #333;
            border-radius: 999px;
            background: #1b1b1b;
            color: #ddd;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
        }

        .chip:active { transform: scale(0.95); }

        #results {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            padding: 0 6px 8px;
        }

        #searchPanel.results-hidden #results { display: none; }

        .item {
            display: flex;
            gap: 10px;
            padding: 6px;
            border-radius: 10px;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .item:active { background: #1c1c1c; }
        .item.active { background: #1d1d1d; border-left-color: #ff0000; }

        .thumb {
            position: relative;
            flex: 0 0 38%;
            max-width: 168px;
            aspect-ratio: 16 / 9;
            border-radius: 8px;
            overflow: hidden;
            background: #222;
        }

        .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

        .dur {
            position: absolute;
            right: 4px;
            bottom: 4px;
            padding: 1px 5px;
            border-radius: 4px;
            background: rgba(0, 0, 0, .85);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
        }

        .dur.live { background: #e00; }

        .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }

        .meta .t {
            font-size: 14px;
            line-height: 1.3;
            color: #f1f1f1;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .meta .c { font-size: 12px; color: #999; }

        .msg { padding: 18px 12px; text-align: center; color: #888; font-size: 14px; line-height: 1.5; }
        .msg.err { color: #ff8a80; }

        .keyform { display: flex; gap: 8px; margin-top: 12px; }
        .keyform input {
            flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid #333; border-radius: 10px;
            background: #0b0b0b; color: #fff; font-size: 15px;
        }

        .more { display: block; margin: 8px auto 0; }

        /* In the Android app's Picture-in-Picture window: video only */
        .in-pip #bar, .in-pip #toast, .in-pip #searchPanel { display: none !important; }
        .in-pip #main { flex-direction: column !important; }
        .in-pip .player-wrapper { flex: 1 !important; width: 100% !important; aspect-ratio: auto !important; max-height: none !important; }

        /* ---------- Toast ---------- */
        #toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translateX(-50%) translateY(20px);
            max-width: 90%;
            padding: 10px 16px;
            background: #333;
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .25s, transform .25s;
            z-index: 10;
        }

        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    </style>
</head>

<body>
    <div id="main">
    <div class="player-wrapper" id="playerWrapper">
        <div class="placeholder" id="placeholder">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 16.5l6-4.5-6-4.5v9zM12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z" />
            </svg>
            <div>Copy a YouTube link, then tap anywhere</div>
            <small>or share a link to this app</small>
        </div>
    </div>

    <!-- Search panel: shown / hidden with the Search button in the bar -->
    <div id="searchPanel">
        <div class="sp-wrap">
            <div class="sp-head">
                <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off"
                       autocapitalize="off" spellcheck="false" placeholder="Search YouTube">
                <button class="btn" id="searchGo">Search</button>
            </div>
            <div id="suggest"></div>
        </div>
        <div class="sp-tools">
            <button class="chip" id="modeBtn" title="Search playlists only">Playlists</button>
            <span class="grow"></span>
            <button class="chip" id="hideResultsBtn" title="Hide the list (keeps it for later)">Hide results</button>
            <button class="chip" id="clearResultsBtn" title="Remove all results">Clear</button>
            <button class="chip" id="keyBtn" title="YouTube API key">&#128273;</button>
        </div>
        <div id="resultInfo"></div>
        <div id="results"></div>
    </div>
    </div>

    <div id="bar">
        <button class="toggle" id="toggleBar" title="Show / hide">&#9660;</button>
        <div class="row">
            <input id="urlInput" type="text" inputmode="url" autocomplete="off" autocapitalize="off"
                   spellcheck="false" placeholder="Paste YouTube URL, video ID or playlist">
            <button class="btn" id="goBtn">Play</button>
            <button class="btn secondary" id="pasteBtn">Paste</button>
            <button class="btn secondary" id="searchBtn" title="Search YouTube">Search</button>
            <button class="btn secondary" id="pipBtn" title="Picture in Picture">PiP</button>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        const BASE = '/re/yt-v3/';
        const YT_ORIGIN = 'https://www.youtube.com';

        // True when running inside the Android wrapper app
        const NATIVE = typeof window.AndroidBridge !== 'undefined';

        // ---------- PWA: service worker ----------
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker
                    .register(BASE + 'sw.js', { scope: BASE })
                    .catch(err => console.error('SW failed:', err));
            });
        }

        // Called by the Android app when it enters / leaves Picture-in-Picture
        window.onPipChange = (on) => document.body.classList.toggle('in-pip', !!on);

        // ---------- Elements / state ----------
        const $wrapper = document.getElementById('playerWrapper');
        const $input = document.getElementById('urlInput');
        const $bar = document.getElementById('bar');
        const $toast = document.getElementById('toast');

        let isPlaying = false;
        let pipWin = null;                              // Document PiP window (desktop)
        let cur = { list: null, video: null, time: 0 }; // what is playing right now
        let ytState = -1;                               // -1 none, 0 ended, 1 playing, 2 paused
        let queue = { items: [], pos: -1 };             // auto-next list = latest video search results
        let lastLoadAt = 0, advanceBusy = false;
        let hiddenAt = 0, wasPlayingAtHide = false;

        // ---------- Toast ----------
        let toastTimer;
        function toast(msg) {
            $toast.textContent = msg;
            $toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => $toast.classList.remove('show'), 3200);
        }

        // ---------- Parsing ----------
        const cUrl = 'autoplay=1&controls=1&fs=1&disablekb=0&rel=0&iv_load_policy=3&playsinline=1&enablejsapi=1'
            + '&origin=' + encodeURIComponent(location.origin)
            + '&forigin=' + encodeURIComponent(location.origin);

        const ID_RE = /^[a-zA-Z0-9_-]{11}$/;
        const LIST_RE = /^(PL|UU|OL|FL|RD|LL)[a-zA-Z0-9_-]{10,}$/;

        function parseInput(raw) {
            const out = { video: null, list: null };
            if (!raw) return out;
            raw = raw.trim();

            if (raw.includes('<iframe')) {
                const m = raw.match(/src="([^"]+)"/);
                if (m) raw = m[1];
            }

            const urlMatch = raw.match(/https?:\/\/[^\s]+/);
            if (urlMatch) {
                try {
                    const u = new URL(urlMatch[0]);
                    out.list = u.searchParams.get('list');
                    let v = u.searchParams.get('v');
                    if (!v) {
                        const seg = u.pathname.split('/').filter(Boolean);
                        if (u.hostname.includes('youtu.be')) v = seg[0];
                        else if (['embed', 'live', 'shorts', 'v'].includes(seg[0])) v = seg[1];
                    }
                    if (v && ID_RE.test(v)) out.video = v;
                    return out;
                } catch (e) { /* fall through */ }
            }

            if (LIST_RE.test(raw)) out.list = raw;
            else if (ID_RE.test(raw)) out.video = raw;
            return out;
        }

        // ---------- YouTube iframe messaging (state + commands) ----------
        function activeFrame() {
            return pipWin
                ? pipWin.document.querySelector('iframe')
                : document.querySelector('#playerWrapper iframe');
        }

        function yt(func, args = []) {
            // No YouTube playlist playing, but we have search results -> Next / Previous walk through them
            if ((func === 'nextVideo' || func === 'previousVideo') && !cur.list && queue.items.length) {
                skipQueue(func === 'nextVideo' ? 1 : -1);
                return;
            }
            const f = activeFrame();
            if (!f || !f.contentWindow) return;
            try {
                f.contentWindow.postMessage(JSON.stringify({ event: 'command', func, args }), YT_ORIGIN);
            } catch (e) { /* ignore */ }
        }

        function handshake(f) {
            try {
                f.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widest' }), YT_ORIGIN);
            } catch (e) { /* ignore */ }
        }

        function onYtMessage(e) {
            if (e.origin !== YT_ORIGIN) return;
            let d = e.data;
            if (typeof d === 'string') { try { d = JSON.parse(d); } catch (_) { return; } }
            if (!d) return;

            if (d.event === 'onStateChange') setState(d.info);

            // Unplayable video (removed / not embeddable): move on to the next result
            if (d.event === 'onError' && !cur.list && queue.items.length && !advanceBusy) {
                toast('Video unavailable, skipping...');
                advanceBusy = true;
                advanceNext(true).finally(() => { advanceBusy = false; });
            }

            if (d.event === 'infoDelivery' && d.info) {
                if (typeof d.info.currentTime === 'number') { cur.time = d.info.currentTime; reportPosition(false); }
                if (typeof d.info.duration === 'number' && d.info.duration !== cur.duration) { cur.duration = d.info.duration; reportPosition(true); }
                if (typeof d.info.playerState === 'number') setState(d.info.playerState);
                if (d.info.videoData) {
                    if (d.info.videoData.video_id && d.info.videoData.video_id !== cur.video) {
                        cur.video = d.info.videoData.video_id;
                        markActive();
                    } else if (d.info.videoData.video_id) cur.video = d.info.videoData.video_id;
                    if (d.info.videoData.title) updateMetaTitle(d.info.videoData.title);
                }
            }
        }
        window.addEventListener('message', onYtMessage);

        // ---------- Background playback: silent audio keeps the page "media active" ----------
        function makeSilentWav() {
            const sr = 8000, n = sr * 10; // 10 s (Chrome only shows media controls for clips > 5 s)
            const buf = new ArrayBuffer(44 + n);
            const v = new DataView(buf);
            const w = (o, s) => [...s].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
            w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt ');
            v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
            v.setUint32(24, sr, true); v.setUint32(28, sr, true); v.setUint16(32, 1, true); v.setUint16(34, 8, true);
            w(36, 'data'); v.setUint32(40, n, true);
            new Uint8Array(buf, 44).fill(128);
            return URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
        }

        const keepAlive = new Audio(makeSilentWav());
        keepAlive.loop = true;

        // Browsers only allow audio after a user gesture -> prime it on the first one
        function unlockAudio() {
            keepAlive.play().then(() => { if (ytState !== 1) keepAlive.pause(); }).catch(() => {});
        }
        ['pointerdown', 'keydown', 'touchstart'].forEach(ev =>
            window.addEventListener(ev, unlockAudio, { once: true, passive: true }));

        // Tell the Android notification where we are (for its seek bar)
        let lastPosSent = 0;
        function reportPosition(force) {
            if (!NATIVE) return;
            const now = Date.now();
            if (!force && now - lastPosSent < 4000) return;
            lastPosSent = now;
            try {
                AndroidBridge.setPosition(Math.floor((cur.time || 0) * 1000), Math.floor((cur.duration || 0) * 1000));
            } catch (e) {}
        }

        function nativeCall(fn, arg) {
            if (NATIVE) { try { AndroidBridge[fn](arg); } catch (e) {} }
        }

        function setState(s) {
            nativeCall('setState', s);
            reportPosition(true);
            const wasPlaying = ytState === 1;
            ytState = s;
            const ms = 'mediaSession' in navigator ? navigator.mediaSession : null;

            // Song finished and it is not a YouTube playlist -> play the next search result
            if (s === 0 && !cur.list && queue.items.length && !advanceBusy && Date.now() - lastLoadAt > 2500) {
                advanceBusy = true;
                advanceNext(true).then((ok) => {
                    if (!ok) { if (ms) ms.playbackState = 'paused'; keepAlive.pause(); }
                }).finally(() => { advanceBusy = false; });
                return; // keep the silent audio running so background playback is not lost
            }

            if (s === 1) {
                if (ms) ms.playbackState = 'playing';
                keepAlive.play().catch(() => {});
            } else if (s === 2) {
                // If the browser paused the video right as the app went to background, resume it once
                if (wasPlaying && document.hidden && wasPlayingAtHide && Date.now() - hiddenAt < 2000) {
                    yt('playVideo');
                    return;
                }
                if (ms) ms.playbackState = 'paused';
                keepAlive.pause();
            } else if (s === 0) {
                if (ms) ms.playbackState = 'paused';
                keepAlive.pause();
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                hiddenAt = Date.now();
                wasPlayingAtHide = ytState === 1;
            }
        });

        // ---------- Media Session (lock screen / notification controls) ----------
        function updateMetaTitle(title) {
            nativeCall('setTitle', title);
            if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
            navigator.mediaSession.metadata = new MediaMetadata({
                title,
                artist: 'Ads Free YouTube Player',
                artwork: [{ src: BASE + 'icon-512.png', sizes: '512x512', type: 'image/png' }]
            });
        }

        function setupMediaSession() {
            refreshSkip();
            if (!('mediaSession' in navigator)) return;
            const ms = navigator.mediaSession;
            const set = (a, fn) => { try { ms.setActionHandler(a, fn); } catch (e) { /* unsupported */ } };

            updateMetaTitle('YouTube Player');
            set('play', () => { yt('playVideo'); keepAlive.play().catch(() => {}); });
            set('pause', () => yt('pauseVideo'));
            set('seekbackward', () => yt('seekTo', [Math.max(0, cur.time - 10), true]));
            set('seekforward', () => yt('seekTo', [cur.time + 10, true]));
        }

        // ---------- Player ----------
        function updateHistory(listId, videoId) {
            const url = new URL(window.location.href);
            ['url', 'text', 'title'].forEach(k => url.searchParams.delete(k));
            if (videoId) url.searchParams.set('code', videoId); else url.searchParams.delete('code');
            if (listId) url.searchParams.set('list', listId); else url.searchParams.delete('list');
            window.history.replaceState({}, '', url);
        }

        function embedSrc(list, video, start = 0) {
            const st = start > 1 ? `&start=${Math.floor(start)}` : '';
            if (list) {
                return video
                    ? `${YT_ORIGIN}/embed/${video}/?playlist=${list}&listType=playlist&list=${list}&${cUrl}${st}`
                    : `${YT_ORIGIN}/embed/?listType=playlist&list=${list}&${cUrl}${st}`;
            }
            return `${YT_ORIGIN}/embed/${video}?playlist=${video}&${cUrl}${st}`;
        }

        function mountFrame(container, src) {
            container.innerHTML = '';
            const f = container.ownerDocument.createElement('iframe');
            f.src = src;
            f.title = 'Ads Free YouTube Video Player';
            f.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen';
            f.referrerPolicy = 'strict-origin-when-cross-origin';
            f.allowFullscreen = true;
            f.addEventListener('load', () => {
                handshake(f);
                setTimeout(() => handshake(f), 1000);
            });
            container.appendChild(f);
            return f;
        }

        function displayVideo(listId, videoId, start = 0) {
            cur = { list: listId || null, video: videoId || null, time: start, duration: 0 };
            ytState = -1;
            lastLoadAt = Date.now();
            // If the PiP window is open, load the new video there
            mountFrame(pipWin ? pipWin.document.body : $wrapper, embedSrc(listId, videoId, start));
            isPlaying = true;
            if (NATIVE) { try { AndroidBridge.setActive(true); } catch (e) {} }
            setupMediaSession();
            markActive();
        }

        function play(raw) {
            const r = parseInput(raw);
            if (!r.video && !r.list) return false;
            updateHistory(r.list, r.video);
            displayVideo(r.list, r.video);
            $input.value = '';
            $input.blur();
            return true;
        }

        // ---------- Picture in Picture ----------
        function pipPlaceholder() {
            $wrapper.innerHTML = `
                <div class="placeholder" id="pipNote">
                    <div>Playing in Picture-in-Picture</div>
                    <small>Tap here to bring it back</small>
                </div>`;
            document.getElementById('pipNote').addEventListener('click', () => pipWin && pipWin.close());
        }

        async function togglePiP() {
            if (!isPlaying) { toast('Play a video first'); return; }

            // Android app: native Picture-in-Picture
            if (NATIVE) { AndroidBridge.enterPip(); return; }

            if (pipWin) { pipWin.close(); return; }

            // Desktop Chrome / Edge 116+: move the player into a floating always-on-top window
            if ('documentPictureInPicture' in window) {
                try {
                    const snap = { ...cur };
                    pipWin = await documentPictureInPicture.requestWindow({ width: 480, height: 270 });
                    const style = pipWin.document.createElement('style');
                    style.textContent = 'html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}iframe{width:100%;height:100%;border:0}';
                    pipWin.document.head.appendChild(style);
                    pipWin.addEventListener('message', onYtMessage);

                    mountFrame(pipWin.document.body, embedSrc(snap.list, snap.video, snap.time));
                    pipPlaceholder();

                    pipWin.addEventListener('pagehide', () => {
                        pipWin = null;
                        mountFrame($wrapper, embedSrc(cur.list, cur.video, cur.time)); // resume where it left off
                    });
                } catch (e) {
                    pipWin = null;
                    toast('Could not open Picture-in-Picture');
                }
                return;
            }

            // Other browsers: fullscreen the player, then press Home -> Chrome may shrink it into PiP
            const f = activeFrame();
            try {
                await f.requestFullscreen();
                toast('Now press Home to enter Picture-in-Picture');
            } catch (e) {
                toast('Tap the player\'s fullscreen button, then press Home');
            }
        }

        // ---------- Clipboard ----------
        async function readClipboard() {
            if (NATIVE) return AndroidBridge.clip();
            return navigator.clipboard.readText();
        }

        async function pasteFromClipboard() {
            try {
                const text = await readClipboard();
                if (!text || !text.trim()) { toast('Clipboard is empty'); return; }
                if (!play(text)) toast('No YouTube link found in clipboard');
            } catch (e) {
                toast('Clipboard blocked. Paste into the box below instead.');
                $input.focus();
            }
        }


        // =====================================================
        //  SEARCH  (YouTube Data API v3)
        // =====================================================
        // Option A: put your key here.  Option B: leave empty and tap the key button in the Search panel.
        const YT_API_KEY = '';
        const KEY_STORE = 'yt_api_key';
        const API = 'https://www.googleapis.com/youtube/v3/';

        const $panel = document.getElementById('searchPanel');
        const $sInput = document.getElementById('searchInput');
        const $results = document.getElementById('results');
        const $info = document.getElementById('resultInfo');
        const $searchBtn = document.getElementById('searchBtn');
        const $hideBtn = document.getElementById('hideResultsBtn');

        let sq = { q: '', token: null, items: [], loading: false, mode: 'video' };
        let playlistMode = false;
        let activeId = null;

        function getKey() {
            try { return localStorage.getItem(KEY_STORE) || YT_API_KEY; } catch (e) { return YT_API_KEY; }
        }
        function saveKey(k) {
            try { k ? localStorage.setItem(KEY_STORE, k) : localStorage.removeItem(KEY_STORE); } catch (e) {}
        }

        function decodeHtml(s) {
            const t = document.createElement('textarea');
            t.innerHTML = s || '';
            return t.value;
        }

        function fmtDuration(iso, live) {
            if (live === 'live') return 'LIVE';
            if (live === 'upcoming') return 'SOON';
            const m = /^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/.exec(iso || '');
            if (!m) return '';
            const h = (+m[1] || 0) * 24 + (+m[2] || 0), mi = +m[3] || 0, s = +m[4] || 0;
            const ss = String(s).padStart(2, '0');
            return h ? `${h}:${String(mi).padStart(2, '0')}:${ss}` : `${mi}:${ss}`;
        }

        function timeAgo(iso) {
            const sec = (Date.now() - new Date(iso).getTime()) / 1000;
            if (!isFinite(sec) || sec < 0) return '';
            const u = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60]];
            for (const [n, v] of u) {
                if (sec >= v) { const c = Math.floor(sec / v); return `${c} ${n}${c > 1 ? 's' : ''} ago`; }
            }
            return 'just now';
        }

        function el(tag, cls, text) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text != null) e.textContent = text;
            return e;
        }

        function showMsg(text, isErr) {
            $results.innerHTML = '';
            $results.appendChild(el('div', 'msg' + (isErr ? ' err' : ''), text));
        }

        function showKeyForm(note) {
            $panel.classList.remove('results-hidden');
            $hideBtn.textContent = 'Hide results';
            $results.innerHTML = '';
            const box = el('div', 'msg');
            box.appendChild(el('div', '', note || 'Search needs a free YouTube Data API v3 key.'));
            const form = el('div', 'keyform');
            const inp = el('input');
            inp.type = 'text'; inp.placeholder = 'Paste API key'; inp.value = getKey();
            inp.autocomplete = 'off'; inp.spellcheck = false;
            const save = el('button', 'btn', 'Save');
            save.addEventListener('click', () => {
                saveKey(inp.value.trim());
                toast(inp.value.trim() ? 'API key saved' : 'API key removed');
                renderResults();
            });
            form.append(inp, save);
            box.appendChild(form);
            $results.appendChild(box);
        }

        function renderResults() {
            $results.innerHTML = '';
            if (!sq.items.length) {
                $info.textContent = '';
                showMsg(sq.q ? 'No results.' : 'Type something above and press Search.');
                return;
            }
            const isList = sq.mode === 'playlist';
            $info.textContent = `${sq.items.length} ${isList ? 'playlists' : 'results'} for "${sq.q}"`;
            const frag = document.createDocumentFragment();
            sq.items.forEach((it, idx) => {
                const row = el('div', 'item' + (it.id === activeId ? ' active' : ''));
                row.dataset.id = it.id;
                row.dataset.i = idx;

                const th = el('div', 'thumb');
                const img = el('img');
                img.loading = 'lazy'; img.alt = '';
                img.src = isList ? it.thumb : `https://i.ytimg.com/vi/${it.id}/mqdefault.jpg`;
                th.appendChild(img);
                if (isList) {
                    if (it.count != null) th.appendChild(el('span', 'dur', it.count + ' videos'));
                } else if (it.duration) {
                    th.appendChild(el('span', 'dur' + (it.duration === 'LIVE' ? ' live' : ''), it.duration));
                }

                const meta = el('div', 'meta');
                meta.appendChild(el('div', 't', it.title));
                meta.appendChild(el('div', 'c', it.channel));
                meta.appendChild(el('div', 'c', (isList ? 'Playlist \u00b7 ' : '') + timeAgo(it.published)));

                row.append(th, meta);
                frag.appendChild(row);
            });
            $results.appendChild(frag);

            if (sq.token) {
                const more = el('button', 'chip more', sq.loading ? 'Loading...' : 'Load more');
                more.addEventListener('click', () => runSearch(true));
                $results.appendChild(more);
            }
        }

        function markActive() {
            activeId = sq.mode === 'playlist' ? (cur.list || null) : (cur.video || null);
            $results.querySelectorAll('.item').forEach(n => n.classList.toggle('active', n.dataset.id === activeId));
        }

        // =====================================================
        //  QUEUE: the latest video search results play one after another
        // =====================================================
        function skipAvailable() { return !!cur.list || queue.items.length > 0; }

        // Enables / disables Previous & Next in the notification (native) and in the browser media session
        function refreshSkip() {
            const ok = skipAvailable();
            nativeCall('setHasList', ok);
            if ('mediaSession' in navigator) {
                const ms = navigator.mediaSession;
                try {
                    ms.setActionHandler('previoustrack', ok ? () => yt('previousVideo') : null);
                    ms.setActionHandler('nexttrack', ok ? () => yt('nextVideo') : null);
                } catch (e) { /* unsupported */ }
            }
        }

        // Where are we in the queue? (-1 = the playing video is not in the results)
        function queueIndex() {
            const i = queue.items.findIndex(x => x.id === cur.video);
            return i >= 0 ? i : queue.pos;
        }

        function playQueueIndex(i) {
            const it = queue.items[i];
            if (!it) return false;
            const hadList = !!cur.list;
            queue.pos = i;
            lastLoadAt = Date.now();
            updateHistory(null, it.id);

            const f = activeFrame();
            if (f && f.contentWindow && !hadList) {
                // Same player, just load the next video (fast, and keeps background playback alive)
                cur = { list: null, video: it.id, time: 0, duration: 0 };
                ytState = -1;
                yt('loadVideoById', [it.id, 0]);
                isPlaying = true;
                updateMetaTitle(it.title);
                refreshSkip();
            } else {
                displayVideo(null, it.id);
                updateMetaTitle(it.title);
            }
            markActive();
            const row = $results.querySelector('.item.active');
            if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
            return true;
        }

        function canLoadMoreForQueue() {
            return sq.mode === 'video' && sq.items === queue.items && !!sq.token && !sq.loading && !!getKey();
        }

        // Plays the next result. Returns true if something started playing.
        async function advanceNext(auto) {
            const i = queueIndex() + 1;
            if (i >= queue.items.length && canLoadMoreForQueue()) {
                await runSearch(true, true);            // fetch the next page of results quietly
            }
            if (i >= queue.items.length) {
                if (!auto) toast('End of results');
                return false;
            }
            return playQueueIndex(i);
        }

        function skipQueue(dir) {
            if (dir > 0) { advanceNext(false); return; }
            const base = queueIndex();
            if (base <= 0) { yt('seekTo', [0, true]); return; }   // first song: restart it
            playQueueIndex(base - 1);
        }

        async function api(path, params) {
            const r = await fetch(API + path + '?' + new URLSearchParams(params));
            const j = await r.json().catch(() => ({}));
            if (!r.ok) {
                const e = new Error((j.error && j.error.message) || ('HTTP ' + r.status));
                e.reason = j.error && j.error.errors && j.error.errors[0] && j.error.errors[0].reason;
                throw e;
            }
            return j;
        }

        async function runSearch(more, silent) {
            if (sq.loading) return;
            hideSug();
            const key = getKey();
            if (!key) { showKeyForm(); return; }

            const q = more ? sq.q : $sInput.value.trim();
            if (!q) { $sInput.focus(); return; }

            // A pasted link / iframe in the search box is simply played
            if (!more && (/https?:\/\//i.test(q) || q.includes('<iframe'))) {
                if (play(q)) { $sInput.value = ''; return; }
            }

            const mode = more ? sq.mode : (playlistMode ? 'playlist' : 'video');

            if (!silent) {
                $panel.classList.remove('results-hidden');
                $hideBtn.textContent = 'Hide results';
            }
            sq.loading = true;
            if (!more) { sq = { q, token: null, items: [], loading: true, mode }; showMsg('Searching...'); }
            else if (!silent) renderResults();

            try {
                const p = { part: 'snippet', type: mode, maxResults: '15', q: sq.q, key };
                if (mode === 'video') p.videoEmbeddable = 'true';   // only videos that can play here
                if (more && sq.token) p.pageToken = sq.token;
                const s = await api('search', p);

                const found = (s.items || []).filter(i => i.id && (mode === 'video' ? i.id.videoId : i.id.playlistId));
                const ids = found.map(i => mode === 'video' ? i.id.videoId : i.id.playlistId);

                // second call (1 quota unit): durations for videos, video counts for playlists
                const details = {};
                if (ids.length) {
                    try {
                        const v = mode === 'video'
                            ? await api('videos', { part: 'contentDetails,snippet', id: ids.join(','), key })
                            : await api('playlists', { part: 'contentDetails', id: ids.join(','), key });
                        (v.items || []).forEach(x => details[x.id] = x);
                    } catch (e) { /* extra details are optional */ }
                }

                const fresh = found.map((i, n) => {
                    const id = ids[n], d = details[id];
                    if (mode === 'video') {
                        const sn = (d && d.snippet) || i.snippet;
                        return {
                            id,
                            title: decodeHtml(sn.title),
                            channel: decodeHtml(sn.channelTitle),
                            published: sn.publishedAt,
                            duration: d ? fmtDuration(d.contentDetails.duration, sn.liveBroadcastContent) : ''
                        };
                    }
                    const sn = i.snippet, th = sn.thumbnails || {};
                    return {
                        id,
                        title: decodeHtml(sn.title),
                        channel: decodeHtml(sn.channelTitle),
                        published: sn.publishedAt,
                        count: d ? d.contentDetails.itemCount : null,
                        thumb: ((th.medium || th.high || th.default) || {}).url || ''
                    };
                });

                if (more) fresh.forEach(f => { if (!sq.items.some(o => o.id === f.id)) sq.items.push(f); }); // same array -> queue grows too
                else sq.items = fresh;

                // New video results become the auto-next queue (the current song keeps playing)
                if (mode === 'video' && !more) { queue.items = sq.items; queue.pos = -1; }

                sq.token = s.nextPageToken || null;
                sq.loading = false;
                refreshSkip();
                renderResults();
                markActive();
            } catch (e) {
                sq.loading = false;
                const bad = e.reason === 'keyInvalid' || e.reason === 'forbidden' || e.reason === 'accessNotConfigured'
                    || /API key|referer|referrer/i.test(e.message);
                if (e.reason === 'quotaExceeded' || e.reason === 'dailyLimitExceeded') {
                    if (sq.items.length) renderResults(); else showMsg('Daily search limit reached. It resets at midnight Pacific Time, or use another API key (key button).', true);
                    toast('YouTube quota exceeded');
                } else if (bad) {
                    showKeyForm('The API key was rejected: ' + e.message);
                } else {
                    if (sq.items.length) { renderResults(); toast('Search failed'); }
                    else showMsg('Search failed: ' + e.message + (navigator.onLine ? '' : ' (you are offline)'), true);
                }
            }
        }

        // ---------- Auto-suggestions (as you type) ----------
        const $sug = document.getElementById('suggest');
        const sugCache = new Map();
        let sugReq = 0, sugCb = 0, sugTimer = null, sugIndex = -1, sugList = [];

        // YouTube's public suggest service, loaded as a <script> (JSONP) because it has no CORS headers.
        function fetchSuggestions(q) {
            return new Promise((resolve) => {
                if (sugCache.has(q)) return resolve(sugCache.get(q));
                const cb = '__ytsug' + (++sugCb);
                const s = document.createElement('script');
                let done = false, t;
                const finish = (list) => {
                    if (done) return;
                    done = true;
                    clearTimeout(t);
                    delete window[cb];
                    s.remove();
                    resolve(list);
                };
                t = setTimeout(() => finish([]), 4000);
                window[cb] = (data) => {
                    const list = ((data && data[1]) || []).map(x => Array.isArray(x) ? x[0] : x)
                        .filter(Boolean).slice(0, 8);
                    sugCache.set(q, list);
                    finish(list);
                };
                s.onerror = () => finish([]);
                s.src = 'https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q='
                    + encodeURIComponent(q) + '&jsonp=' + cb;
                document.head.appendChild(s);
            });
        }

        function hideSug() {
            sugReq++;               // ignore any answer still on its way
            sugIndex = -1;
            $sug.style.display = 'none';
        }

        function pickSug(text) {
            $sInput.value = text;
            hideSug();
            $sInput.blur();
            runSearch(false);
        }

        function highlightSug() {
            [...$sug.children].forEach((n, i) => n.classList.toggle('sel', i === sugIndex));
        }

        function renderSug(list) {
            sugList = list;
            sugIndex = -1;
            $sug.innerHTML = '';
            if (!list.length) { $sug.style.display = 'none'; return; }
            list.forEach(text => {
                const row = el('div', 'sg');
                row.appendChild(el('span', 'ic', '\u{1F50D}'));
                row.appendChild(el('span', 'tx', text));
                const fill = el('button', 'fill', '\u2196');
                fill.title = 'Put in search box';
                fill.addEventListener('click', (e) => {
                    e.stopPropagation();
                    $sInput.value = text + ' ';
                    $sInput.focus();
                    onSearchTyping();
                });
                row.appendChild(fill);
                row.addEventListener('click', () => pickSug(text));
                $sug.appendChild(row);
            });
            $sug.style.display = 'block';
        }

        function onSearchTyping() {
            clearTimeout(sugTimer);
            const q = $sInput.value.trim();
            if (!q || /https?:\/\//i.test(q) || q.includes('<iframe')) { hideSug(); return; }
            sugTimer = setTimeout(async () => {
                const id = ++sugReq;
                const list = await fetchSuggestions(q);
                if (id !== sugReq || document.activeElement !== $sInput) return; // stale or user left the box
                renderSug(list);
            }, 180);
        }

        $sInput.addEventListener('input', onSearchTyping);
        $sInput.addEventListener('blur', () => setTimeout(hideSug, 200));
        $sInput.addEventListener('keydown', (e) => {
            const open = $sug.style.display === 'block';
            if (e.key === 'ArrowDown' && open) {
                e.preventDefault(); sugIndex = (sugIndex + 1) % sugList.length; highlightSug();
            } else if (e.key === 'ArrowUp' && open) {
                e.preventDefault(); sugIndex = (sugIndex - 1 + sugList.length) % sugList.length; highlightSug();
            } else if (e.key === 'Escape') {
                hideSug();
            } else if (e.key === 'Enter') {
                if (open && sugIndex >= 0) pickSug(sugList[sugIndex]);
                else { hideSug(); runSearch(false); $sInput.blur(); }
            }
        });

        // ---------- Search panel UI ----------
        function toggleSearch(force) {
            const open = typeof force === 'boolean' ? force : !document.body.classList.contains('search-open');
            document.body.classList.toggle('search-open', open);
            if (!open) hideSug();
            $searchBtn.classList.toggle('on', open);
            if (open && !sq.items.length) {
                if (!$results.children.length) renderResults();
                setTimeout(() => $sInput.focus(), 50);
            }
        }

        // Android back button: close the search panel first (the app asks the page before exiting)
        window.onBackPress = () => {
            if ($sug.style.display === 'block') { hideSug(); return true; }
            if (document.body.classList.contains('search-open')) { toggleSearch(false); return true; }
            return false;
        };

        $searchBtn.addEventListener('click', () => toggleSearch());
        document.getElementById('searchGo').addEventListener('click', () => runSearch(false));

        // Hide / show the result list (results stay in memory)
        $hideBtn.addEventListener('click', () => {
            const hidden = $panel.classList.toggle('results-hidden');
            $hideBtn.textContent = hidden ? 'Show results' : 'Hide results';
        });

        // Clear everything
        document.getElementById('clearResultsBtn').addEventListener('click', () => {
            sq = { q: '', token: null, items: [], loading: false, mode: sq.mode };
            queue = { items: [], pos: -1 };          // clearing results also empties the auto-next queue
            refreshSkip();
            hideSug();
            $sInput.value = '';
            $panel.classList.remove('results-hidden');
            $hideBtn.textContent = 'Hide results';
            renderResults();
            $sInput.focus();
        });

        document.getElementById('keyBtn').addEventListener('click', () => showKeyForm('YouTube Data API v3 key'));

        // Tap a result -> play its video in the current player; the list stays open
        $results.addEventListener('click', (e) => {
            const row = e.target.closest('.item');
            if (!row) return;
            if (sq.mode === 'playlist') {
                // Playlist: YouTube handles next / previous itself
                if (!play('https://www.youtube.com/playlist?list=' + row.dataset.id)) toast('Could not play this playlist');
                return;
            }
            // Video: play it from the queue, so the following results play after it
            queue.items = sq.items;
            if (!playQueueIndex(+row.dataset.i)) toast('Could not play this video');
        });

        // Playlists-only switch
        const $modeBtn = document.getElementById('modeBtn');
        $modeBtn.addEventListener('click', () => {
            playlistMode = !playlistMode;
            $modeBtn.classList.toggle('on', playlistMode);
            $sInput.placeholder = playlistMode ? 'Search playlists' : 'Search YouTube';
            if ($sInput.value.trim()) runSearch(false);   // redo the current search in the new mode
            else $sInput.focus();
        });

        renderResults();

        // ---------- Events ----------
        document.addEventListener('click', (e) => {
            if (isPlaying) return;
            if (e.target.closest('#bar') || e.target.closest('#searchPanel')) return;
            pasteFromClipboard();
        });

        document.addEventListener('paste', (e) => {
            if (e.target && e.target.id === 'searchInput') return; // pasting a search term
            const text = (e.clipboardData || window.clipboardData).getData('text');
            if (play(text)) e.preventDefault();
            else if (e.target !== $input) toast('No YouTube link found');
        });

        document.getElementById('pasteBtn').addEventListener('click', pasteFromClipboard);
        document.getElementById('pipBtn').addEventListener('click', togglePiP);

        document.getElementById('goBtn').addEventListener('click', () => {
            const v = $input.value.trim();
            if (!v) return pasteFromClipboard();
            if (!play(v)) toast('Not a valid YouTube link or ID');
        });

        $input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('goBtn').click();
        });

        document.getElementById('toggleBar').addEventListener('click', () => {
            $bar.classList.toggle('collapsed');
        });

        // ---------- Load from URL (code / list / share target url+text) ----------
        function loadFromLocation() {
            const p = new URLSearchParams(window.location.search);

            const sources = [p.get('code'), p.get('url'), p.get('text')];
            let video = null;
            let list = null;

            if (p.get('list')) {
                const l = parseInput(p.get('list'));
                list = l.list || p.get('list');
            }

            for (const s of sources) {
                const r = parseInput(s);
                if (r.video && !video) video = r.video;
                if (r.list && !list) list = r.list;
            }

            if (!video && !list) return;

            if (!NATIVE) {
                // If the user is on a mobile device, then open the YouTube app instead of this web page (if possible)
                const ua = navigator.userAgent || '';
                if (/Android/i.test(ua)) {
                    // myyt://play?list=... OR // myyt://play?code=... or // myyt://play?list=...&code=...
                    const myyt = `myyt://play?${list ? 'list=' + encodeURIComponent(list) : ''}${video ? '&code=' + encodeURIComponent(video) : ''}`;
                    window.location.href = myyt;
                }
            }

            updateHistory(list, video);
            displayVideo(list, video);

            // Kept from original code: re-nudge the iframe src
            setTimeout(() => {
                const f = document.querySelector('#playerWrapper iframe');
                if (f) f.src = f.src + '&';
            }, 1500);
        }

        window.addEventListener('DOMContentLoaded', () => setTimeout(loadFromLocation, 300));
    </script>
</body>
</html>
